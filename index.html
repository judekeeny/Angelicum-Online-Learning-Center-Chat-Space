<body>
<header class="top" id="top" hidden></header>
<main id="main"><div class="wrap" id="app"><div class="loading">Loading…</div></div></main>

<script>
(function(){
"use strict";
const C = window.CLASS_CONFIG;
const KINDS = ["Essay","Poem","Short Story","Book Report","Journal","Other"];
const PAGE = 100;            // chat messages loaded at a time
const app = document.getElementById("app");
const mainEl = document.getElementById("main");
const topEl = document.getElementById("top");
const BASE_TITLE = C.CLASS_NAME || "Class Chat";
document.title = BASE_TITLE;

/* ---------- tiny DOM helper (all text goes in via textContent — safe) ---------- */
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props || {})){
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()){
    if (kid === null || kid === undefined || kid === false) continue;
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
function show(full, ...nodes){
  mainEl.classList.toggle("full", !!full);
  app.replaceChildren(...nodes);
  mainEl.scrollTop = 0;
}
function fmtDate(s){ return new Date(s).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
function initials(n){ return (n || "?").split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join(""); }
function friendly(err){
  const m = (err && (err.message || err.error_description)) || String(err);
  if (/Invalid login/i.test(m)) return "That email and password don't match. Try again, or use “Forgot password?”.";
  if (/Email not confirmed/i.test(m)) return "Please confirm your email first — check your inbox (and spam folder) for the link.";
  if (/already registered/i.test(m)) return "There's already an account with that email. Try signing in instead.";
  if (/row-level security|permission denied/i.test(m)) return "You don't have permission to do that.";
  return m;
}
const CHAT_FILE_MARKER = "\n[chat-file:v1:";
const CHAT_FILE_TYPES = /\.(pdf|docx?|txt|csv|png|jpe?g|gif|webp)$/i;
function encodeChatFile(body, file){
  return `${body}${CHAT_FILE_MARKER}${encodeURIComponent(JSON.stringify(file))}]`;
}
function parseChatFile(body, authorId){
  if (!body) return { text:"", file:null };
  const marker = body.lastIndexOf(CHAT_FILE_MARKER);
  if (marker < 0 || !body.endsWith("]")) return { text:body, file:null };
  try{
    const file = JSON.parse(decodeURIComponent(body.slice(marker + CHAT_FILE_MARKER.length, -1)));
    if (typeof file.path !== "string" || !file.path.startsWith(`${authorId}/chat/`) ||
        typeof file.name !== "string" || typeof file.type !== "string") return { text:body, file:null };
    return { text:body.slice(0, marker), file };
  } catch {
    return { text:body, file:null };
  }
}
const here = () => location.origin + location.pathname;
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};

/* ---------- setup check ---------- */
if (!C.SUPABASE_URL || C.SUPABASE_URL.startsWith("PASTE") || !window.supabase){
  show(false, h("div",{class:"card panel", style:"max-width:620px;margin:40px auto"},
    h("h2",{text:"Almost there"}),
    h("p",{text:"This site isn't connected to its database yet. Open index.html, find the SETTINGS block near the top, and paste in your Supabase Project URL and key (README.md walks you through it)."})));
  return;
}

const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY);
let session = null, me = null, recovering = false;

/* chat state shared across pages */
const S = { ready:false, rooms:[], reads:{}, unread:new Set(), dmsEnabled:true, people:{}, works:{}, live:null, liveStatus:"" };
/* the chat view currently on screen (if any) */
let V = null;

function resetChat(){
  if (S.live){ sb.removeChannel(S.live); }
  Object.assign(S, { ready:false, rooms:[], reads:{}, unread:new Set(), dmsEnabled:true, people:{}, works:{}, live:null, liveStatus:"" });
  V = null;
}

/* ---------- boot & routing ---------- */
async function boot(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((event, s) => {
    const changedUser = (s?.user?.id || null) !== (session?.user?.id || null);
    session = s;
    if (event === "PASSWORD_RECOVERY"){ recovering = true; setTimeout(renderNewPassword, 0); return; }
    if (changedUser){ me = null; resetChat(); setTimeout(route, 0); }
  });
  window.addEventListener("hashchange", route);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && V && V.room) markRead(V.room.id, V.latest); });
  route();
}

async function loadMe(){
  for (let i = 0; i < 4; i++){
    const { data, error } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    if (error) throw error;
    if (data) return data;
    await new Promise(r => setTimeout(r, 600));
  }
  throw new Error("Couldn't find your profile. Please refresh the page.");
}

async function route(){
  if (recovering) return;
  V = null;
  if (!session){ topEl.hidden = true; return renderAuth(); }
  try { if (!me) me = await loadMe(); }
  catch(e){ return show(false, h("div",{class:"msg err", text:friendly(e)})); }
  if (!me.approved){ renderHeader(); return renderPending(); }

  const [page, id] = location.hash.replace(/^#\/?/,"").split("/");
  try{
    await initChat();
    renderHeader();
    if (page === "work" && id) return await renderWork(id);
    if (page === "essays") return await renderLibrary(false);
    if (page === "mine") return await renderLibrary(true);
    if (page === "new") return renderEditor(null);
    if (page === "edit" && id) return await renderEditor(id);
    if (page === "manager" && me.role === "teacher") return await renderManager();
    if (page === "account") return renderAccount();
    return await renderChat(page === "chat" ? id : null);
  } catch(e){
    show(false, h("div",{class:"msg err", text:friendly(e)}));
  }
}

/* =====================================================================
   CHAT — data
   ===================================================================== */
async function initChat(){
  if (S.ready) return;
  const [ppl, settings, reads] = await Promise.all([
    sb.from("profiles").select("id,display_name,approved,role"),
    sb.from("chat_settings").select("dms_enabled").eq("id",1).maybeSingle(),
    sb.from("room_reads").select("room_id,last_read_at")
  ]);
  if (ppl.error) throw ppl.error;
  ppl.data.forEach(p => { S.people[p.id] = p; });
  S.dmsEnabled = settings.data ? settings.data.dms_enabled : true;
  (reads.data || []).forEach(r => { S.reads[r.room_id] = r.last_read_at; });
  await loadRooms();

  S.live = sb.channel("live-" + me.id)
    .on("postgres_changes",{event:"INSERT", schema:"public", table:"messages"}, p => onNewMessage(p.new))
    .on("postgres_changes",{event:"DELETE", schema:"public", table:"messages"}, p => onDeletedMessage(p.old))
    .on("postgres_changes",{event:"INSERT", schema:"public", table:"rooms"}, () => loadRooms().then(refreshChrome))
    .on("postgres_changes",{event:"DELETE", schema:"public", table:"rooms"}, () => loadRooms().then(onRoomsRemoved))
    .on("postgres_changes",{event:"*", schema:"public", table:"room_members"}, () => loadRooms().then(onRoomsRemoved))
    .subscribe(st => {
      S.liveStatus = st;
      if (V && V.status) V.status.textContent = statusText();
    });
  S.ready = true;
}
function statusText(){
  const st = S.liveStatus;
  if (st === "SUBSCRIBED") return "";
  if (st === "CHANNEL_ERROR" || st === "TIMED_OUT" || st === "CLOSED") return "Live updates paused — refresh the page";
  return "Connecting…";
}
const ts = s => (s ? new Date(s).getTime() : 0);

async function loadRooms(){
  const { data, error } = await sb.from("rooms").select("id,kind,name,created_by,last_message_at,room_members(user_id)");
  if (error) throw error;
  S.rooms = data || [];
  S.unread = new Set(S.rooms.filter(r =>
    inMySidebar(r) && r.last_message_at && ts(r.last_message_at) > ts(S.reads[r.id]) && !(V && V.room && V.room.id === r.id)
  ).map(r => r.id));
}
const isMember = r => (r.room_members || []).some(m => m.user_id === me.id);
const inMySidebar = r => r.kind === "space" || isMember(r);
const canPost = r => r.kind === "space" || (isMember(r) && S.dmsEnabled);
function personName(id){ return S.people[id]?.display_name || "Someone"; }
const memberIds = r => (r.room_members || []).map(m => m.user_id);
function roomTitle(r){
  if (r.kind === "space") return r.name;
  if (r.kind === "group" && r.name) return r.name;
  const ids = memberIds(r);
  const others = isMember(r) ? ids.filter(id => id !== me.id) : ids;
  const names = others.map(personName).sort();
  if (r.kind === "dm") return isMember(r) ? (names[0] || "Someone") : names.join(" & ");
  return names.length > 3 ? `${names.slice(0,3).join(", ")} +${names.length - 3}` : (names.join(", ") || "Group chat");
}
function roomIcon(r){
  if (r.kind === "space") return "#";
  if (r.kind === "group") return r.name ? initials(r.name) : String(memberIds(r).length);
  return initials(roomTitle(r));
}
function defaultRoom(){
  const spaces = S.rooms.filter(r => r.kind === "space");
  return spaces.find(r => !r.created_by && r.name === "General") || spaces[0] || null;
}

let readTimer = null;
function markRead(roomId, latest){
  if (!roomId || document.hidden) return;
  const at = latest || new Date().toISOString();
  if (ts(at) <= ts(S.reads[roomId])) { S.unread.delete(roomId); return; }
  S.reads[roomId] = at;
  S.unread.delete(roomId);
  refreshChrome();
  clearTimeout(readTimer);
  readTimer = setTimeout(() => {
    sb.from("room_reads").upsert({ user_id: me.id, room_id: roomId, last_read_at: S.reads[roomId] }, { onConflict:"user_id,room_id" }).then(() => {});
  }, 800);
}

function refreshChrome(){
  document.title = (S.unread.size ? `(${S.unread.size}) ` : "") + BASE_TITLE;
  if (!topEl.hidden && me && me.approved) renderHeader();
  if (V && V.side && V.side.isConnected) V.side.replaceWith(V.side = buildSidebar());
}

async function onNewMessage(m){
  let r = S.rooms.find(x => x.id === m.room_id);
  if (!r){ await loadRooms(); r = S.rooms.find(x => x.id === m.room_id); if (!r) return; }
  r.last_message_at = m.created_at;
  if (V && V.room && V.room.id === m.room_id && V.list && V.list.isConnected){
    await V.append(m);
  } else if (m.author_id !== me.id && inMySidebar(r)){
    S.unread.add(r.id);
  }
  refreshChrome();
}
function onDeletedMessage(old){
  if (!old || old.id == null || !V || !V.list) return;
  V.list.querySelector(`[data-id="${Number(old.id)}"]`)?.remove();
}
function onRoomsRemoved(){
  if (V && V.room && !S.rooms.some(r => r.id === V.room.id)) { location.hash = "#/chat"; return; }
  refreshChrome();
}

async function ensureWorks(ids){
  const missing = [...new Set(ids.filter(Boolean))].filter(id => !(id in S.works));
  if (!missing.length) return;
  const { data } = await sb.from("works").select("id,title,kind,author_id").in("id", missing);
  (data || []).forEach(w => { S.works[w.id] = w; });
  missing.forEach(id => { if (!(id in S.works)) S.works[id] = null; });
}
async function ensurePeople(ids){
  const missing = [...new Set(ids)].filter(id => !(id in S.people));
  if (!missing.length) return;
  const { data } = await sb.from("profiles").select("id,display_name,approved,role").in("id", missing);
  (data || []).forEach(p => { S.people[p.id] = p; });
}

/* =====================================================================
   CHAT — screens
   ===================================================================== */
function buildSidebar(){
  const cur = V && V.room ? V.room.id : (V && V.newDm ? "new" : null);
  const roomLink = (r) => h("a",{href:`#/chat/${r.id}`, class:["room", cur === r.id ? "on" : "", S.unread.has(r.id) ? "unread" : ""].join(" ")},
    h("span",{class:"ic" + (r.kind === "group" ? " grp" : ""), text: roomIcon(r)}),
    h("span",{class:"nm", text: roomTitle(r)}),
    S.unread.has(r.id) ? h("span",{class:"dot"}) : null);

  const spaces = S.rooms.filter(r => r.kind === "space")
    .sort((a,b) => (a.created_by ? 1 : 0) - (b.created_by ? 1 : 0) || a.name.localeCompare(b.name));
  const dms = S.rooms.filter(r => r.kind !== "space" && isMember(r))
    .sort((a,b) => ts(b.last_message_at) - ts(a.last_message_at));

  const newSpaceRow = h("div",{class:"inl", hidden:true});
  const spaceInput = h("input",{type:"text", maxlength:"40", placeholder:"Space name"});
  newSpaceRow.append(spaceInput, h("button",{class:"btn small primary", text:"Add", onclick: createSpace}));
  spaceInput.addEventListener("keydown", e => { if (e.key === "Enter") createSpace(); if (e.key === "Escape") newSpaceRow.hidden = true; });
  async function createSpace(){
    const n = spaceInput.value.trim(); if (!n) return;
    const { data, error } = await sb.rpc("create_space", { space_name: n });
    if (error) return alert(friendly(error));
    await loadRooms(); location.hash = `#/chat/${data}`;
  }

  return h("aside",{class:"side"},
    h("h4",{}, "Spaces", h("button",{title:"New space", "aria-label":"New space", text:"+", onclick:() => { newSpaceRow.hidden = !newSpaceRow.hidden; if (!newSpaceRow.hidden) spaceInput.focus(); }})),
    newSpaceRow,
    spaces.map(roomLink),
    h("h4",{}, "Chats", S.dmsEnabled ? h("a",{href:"#/chat/new", class:"plus", title:"New chat", "aria-label":"New chat", text:"+"}) : null),
    S.dmsEnabled ? h("a",{href:"#/chat/new", class:"room newchat" + (cur === "new" ? " on" : "")}, h("span",{class:"ic", text:"+"}), h("span",{class:"nm", text:"New chat"})) : null,
    dms.length ? dms.map(roomLink) : h("div",{class:"empty-dm", text: S.dmsEnabled ? "Message one classmate or start a group chat." : "Private chats are turned off."})
  );
}

async function renderChat(roomId){
  if (roomId === "new") return renderNewChat();
  let room = roomId ? S.rooms.find(r => r.id === roomId) : null;
  if (!roomId){
    const last = store.get("lastRoom:" + me.id);
    room = S.rooms.find(r => r.id === last && inMySidebar(r)) || defaultRoom();
    if (room) { history.replaceState(null, "", `#/chat/${room.id}`); renderHeader(); }
  }
  V = { room, list:null, side:null, status:null, latest:null, limit:PAGE, seen:new Set(), lastDay:null };
  const view = V;

  if (!room){
    V.side = buildSidebar();
    return show(true, h("div",{class:"card chatapp"}, V.side,
      h("div",{class:"pane"}, h("div",{class:"empty"}, h("h2",{text: roomId ? "That conversation isn't available" : "No spaces yet"}), h("p",{class:"muted", text:"Pick one on the left, or start a new space with +."})))));
  }
  if (inMySidebar(room)) store.set("lastRoom:" + me.id, room.id);

  /* header */
  let sub;
  const n = memberIds(room).length;
  if (room.kind === "space") sub = "Everyone in the class";
  else if (!isMember(room)) sub = `Manager view of a private ${room.kind === "group" ? `group chat (${n} people)` : "conversation"}`;
  else if (room.kind === "group") sub = `Group chat · ${n} people · the manager can read private chats`;
  else sub = "Private conversation · the manager can read private chats";
  const membersSlot = h("div");
  const membersBtn = (room.kind === "group") ? h("button",{class:"btn small", text:`👥 ${n}`, title:"Members", onclick: () => {
      if (membersSlot.firstChild) membersSlot.replaceChildren(); else membersSlot.replaceChildren(groupPanel(room, () => membersSlot.replaceChildren()));
    }}) : null;
  const delSpace = (me.role === "teacher" && room.kind === "space" && room.created_by)
    ? h("button",{class:"btn small danger", text:"Delete space", onclick: async () => {
        if (!confirm(`Delete the space “${room.name}” and all its messages? This can't be undone.`)) return;
        const { error } = await sb.from("rooms").delete().eq("id", room.id);
        if (error) return alert(friendly(error));
        await loadRooms(); location.hash = "#/chat";
      }}) : null;
  V.status = h("span",{class:"status", text:statusText()});
  const head = h("div",{class:"panehead"},
    h("div",{class:"grow"}, h("h2",{text:(room.kind === "space" ? "# " : "") + roomTitle(room)}), h("div",{class:"sub", text:sub})),
    V.status, membersBtn, delSpace);

  /* messages */
  const list = V.list = h("div",{class:"chatlist", "aria-live":"polite"});
  const nearBottom = () => list.scrollHeight - list.scrollTop - list.clientHeight < 140;
  const toBottom = () => { list.scrollTop = list.scrollHeight; };

  function dayLabel(d){
    const today = new Date(); const y = new Date(); y.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return "Today";
    if (d.toDateString() === y.toDateString()) return "Yesterday";
    return d.toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"});
  }
  function workCard(id){
    const w = S.works[id];
    if (!w) return h("div",{class:"wcard gone", text:"Shared essay (no longer available)"});
    return h("a",{class:"wcard", href:`#/work/${w.id}`},
      h("span",{class:"tag", text:w.kind}),
      h("div",{class:"t", text:w.title}),
      h("div",{class:"s", text:`by ${personName(w.author_id)} · Read →`}));
  }
  function msgNode(m){
    const mine = m.author_id === me.id;
    const d = new Date(m.created_at);
    const time = d.toLocaleTimeString(undefined,{hour:"numeric", minute:"2-digit"});
    const node = h("div",{class: mine ? "m mine" : "m", "data-id": String(m.id)});
    const parsed = parseChatFile(m.body, m.author_id);
    const del = (mine || me.role === "teacher") ? h("button",{class:"linkbtn del", type:"button", text:"delete", onclick: async () => {
      if (!confirm("Delete this message?")) return;
      const { error } = await sb.from("messages").delete().eq("id", m.id);
      if (error){ alert(friendly(error)); return; }
      node.remove();
      if (parsed.file){
        const { error: removeError } = await sb.storage.from("works").remove([parsed.file.path]);
        if (removeError) alert(`Message deleted, but its attachment couldn't be removed: ${friendly(removeError)}`);
      }
    }}) : null;
    let fileNode = null;
    if (parsed.file){
      fileNode = h("div",{class:"chat-file", text:"Loading attachment…"});
      sb.storage.from("works").createSignedUrl(parsed.file.path, 60*60).then(({data,error}) => {
        if (error) throw error;
        if (!data?.signedUrl) throw new Error("Could not create an attachment link.");
        const link = h("a",{href:data.signedUrl, target:"_blank", rel:"noopener noreferrer"},
          "📎 ", parsed.file.name);
        fileNode.replaceChildren(link);
        if (parsed.file.type.startsWith("image/")){
          const image = h("img",{src:data.signedUrl, alt:parsed.file.name, loading:"lazy"});
          image.addEventListener("error", () => { image.hidden = true; });
          fileNode.append(image);
        }
      }).catch(error => {
        fileNode.replaceChildren(h("span",{class:"muted", text:`Attachment unavailable: ${friendly(error)}`}));
      });
    }
    node.append(...[
      h("div",{class:"who2"}, mine ? null : h("b",{text:personName(m.author_id)}), time, del),
      parsed.text ? h("div",{class:"bb", text:parsed.text}) : null,
      fileNode,
      m.work_id ? workCard(m.work_id) : (m.body ? null : h("div",{class:"wcard gone", text:"Shared essay (no longer available)"}))
    ].filter(Boolean));
    return node;
  }
  function place(m){
    if (view.seen.has(m.id)) return false;
    view.seen.add(m.id);
    list.querySelector(".empty-note")?.remove();
    const d = new Date(m.created_at);
    if (d.toDateString() !== view.lastDay){ view.lastDay = d.toDateString(); list.append(h("div",{class:"day", text:dayLabel(d)})); }
    list.append(msgNode(m));
    if (ts(m.created_at) > ts(view.latest)) view.latest = m.created_at;
    return true;
  }
  V.append = async (m) => {
    if (V !== view) return;
    const stick = nearBottom() || m.author_id === me.id;
    await Promise.all([ensureWorks([m.work_id]), ensurePeople([m.author_id])]);
    if (place(m) && stick) toBottom();
    markRead(room.id, view.latest);
  };

  async function load(keepFromBottom){
    const { data, error } = await sb.from("messages").select("id,room_id,author_id,body,work_id,created_at")
      .eq("room_id", room.id).order("created_at",{ascending:false}).limit(view.limit);
    if (error) throw error;
    const msgs = data.reverse();
    await Promise.all([ensureWorks(msgs.map(m => m.work_id)), ensurePeople(msgs.map(m => m.author_id))]);
    if (V !== view) return;
    const fromBottom = list.scrollHeight - list.scrollTop;
    list.replaceChildren(); view.seen.clear(); view.lastDay = null;
    if (data.length === view.limit) list.append(h("button",{class:"btn small more", text:"Load earlier messages", onclick: () => { view.limit += PAGE; load(true); }}));
    if (!msgs.length) list.append(h("div",{class:"day empty-note", text: room.kind === "space" ? "No messages yet. Say hello!" : "Start the conversation."}));
    msgs.forEach(place);
    if (keepFromBottom) list.scrollTop = list.scrollHeight - fromBottom; else toBottom();
    markRead(room.id, view.latest);
  }

  /* composer */
  let composer;
  if (canPost(room)){
    const box = h("textarea",{placeholder:`Message ${room.kind === "space" ? "#" + room.name : roomTitle(room)}…`, maxlength:"1000", rows:"1"});
    const sendBtn = h("button",{class:"btn primary", type:"submit", text:"Send"});
    const err = h("div",{class:"msg err", style:"margin:0 0 8px"});
    const fileInput = h("input",{type:"file", accept:".pdf,.doc,.docx,.txt,.csv,.png,.jpg,.jpeg,.gif,.webp", hidden:true});
    const filePreview = h("span",{class:"file-preview"});
    let selectedFile = null;
    fileInput.addEventListener("change", () => {
      selectedFile = fileInput.files?.[0] || null;
      filePreview.textContent = selectedFile ? `${selectedFile.name} (${Math.ceil(selectedFile.size / 1024)} KB)` : "";
      err.textContent = selectedFile && !CHAT_FILE_TYPES.test(selectedFile.name) ? "Choose a PDF, Word document, text/CSV file, or PNG/JPG/GIF/WebP image."
        : selectedFile && selectedFile.size > 10*1024*1024 ? "Files must be 10 MB or smaller." : "";
    });
    const grow = () => { box.style.height = "44px"; box.style.height = Math.min(box.scrollHeight + 2, 140) + "px"; };
    box.addEventListener("input", grow);
    box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); form.requestSubmit(); } });

    const form = h("form",{onsubmit: async (ev) => {
      ev.preventDefault(); err.textContent = "";
      const text = box.value.trim();
      if (!text && !selectedFile) return;
      if (selectedFile && !CHAT_FILE_TYPES.test(selectedFile.name)){ err.textContent = "Choose a PDF, Word document, text/CSV file, or PNG/JPG/GIF/WebP image."; return; }
      if (selectedFile && selectedFile.size > 10*1024*1024){ err.textContent = "Files must be 10 MB or smaller."; return; }
      sendBtn.disabled = true;
      sendBtn.textContent = selectedFile ? "Uploading…" : "Sending…";
      let uploadedPath = null;
      try{
        let body = text;
        if (selectedFile){
          const safeName = selectedFile.name.replace(/[^\w.\-]+/g,"_").slice(-80) || "attachment";
          uploadedPath = `${me.id}/chat/${crypto.randomUUID()}-${safeName}`;
          const { error: uploadError } = await sb.storage.from("works").upload(uploadedPath, selectedFile, {
            contentType:selectedFile.type || undefined
          });
          if (uploadError) throw uploadError;
          body = encodeChatFile(text, {path:uploadedPath, name:selectedFile.name, type:selectedFile.type || ""});
        }
        const { data: row, error } = await sb.from("messages")
          .insert({ room_id: room.id, body, work_id: null })
          .select("id,room_id,author_id,body,work_id,created_at").single();
        if (error) throw error;
        uploadedPath = null;
        selectedFile = null; fileInput.value = ""; filePreview.textContent = "";
        box.value = ""; grow();
        room.last_message_at = row.created_at;
        await view.append(row); toBottom(); box.focus();
      } catch(error){
        let message = friendly(error);
        if (uploadedPath){
          const { error: removeError } = await sb.storage.from("works").remove([uploadedPath]);
          if (removeError) message += ` (Also couldn't clean up the uploaded file: ${friendly(removeError)})`;
        }
        err.textContent = message;
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
      }
    }}, h("div",{class:"rowc"}, box, sendBtn),
      h("div",{class:"tools"},
        h("button",{class:"btn small", type:"button", text:"Attach file", onclick:() => fileInput.click()}),
        h("button",{class:"btn small", type:"button", title:"Search animated GIFs on Google in a new tab; download one to attach it", text:"Browse GIFs", onclick:() => {
          window.open("https://www.google.com/search?tbm=isch&tbs=itp:animated&q=animated+GIF", "_blank", "noopener,noreferrer");
        }}),
        filePreview, fileInput
      ));
    composer = h("div",{class:"composer"}, err, form);
    setTimeout(() => box.focus(), 0);
  } else {
    composer = h("div",{class:"readonly", text: room.kind !== "space" && isMember(room)
      ? "Private chats are turned off by the manager. You can still read this conversation."
      : "You're viewing this conversation as the manager."});
  }

  V.side = buildSidebar();
  show(true, h("div",{class:"card chatapp"}, V.side, h("div",{class:"pane"}, head, membersSlot, list, composer)));
  list.append(h("div",{class:"loading", text:"Loading messages…"}));
  await load(false);
}

/* people picker shared by "New chat" and "Add people" */
function peoplePicker(exclude, onChange){
  const chosen = new Set();
  const q = h("input",{type:"search", placeholder:"Search classmates…"});
  const lst = h("div",{class:"plist"});
  const ppl = Object.values(S.people).filter(p => p.approved && p.id !== me.id && !exclude.includes(p.id))
    .sort((a,b) => a.display_name.localeCompare(b.display_name));
  const draw = () => {
    const s = q.value.trim().toLowerCase();
    const rows = ppl.filter(p => !s || p.display_name.toLowerCase().includes(s));
    lst.replaceChildren(...(rows.length ? rows.map(p => {
      const cb = h("input",{type:"checkbox", checked: chosen.has(p.id)});
      cb.addEventListener("change", () => { cb.checked ? chosen.add(p.id) : chosen.delete(p.id); onChange([...chosen]); });
      return h("label",{class:"person"}, cb, h("span",{class:"ic", text:initials(p.display_name)}),
        h("span",{}, p.display_name, p.role === "teacher" ? h("span",{class:"muted", text:" · Manager"}) : null));
    }) : [h("p",{class:"muted", text: ppl.length ? "No classmates match." : "Everyone is already here."})]));
  };
  q.addEventListener("input", draw); draw();
  return { el: h("div",{}, q, lst), focus: () => q.focus() };
}

      const { error } = await sb.rpc("rename_group", { r: room.id, new_name: nameIn.value.trim() });
      if (error) return (err.textContent = friendly(error));
      await loadRooms(); route();
    }})));
    let adding = [];
    const addBtn = h("button",{class:"btn small primary", text:"Add", disabled:true, onclick: async () => {
      const { error } = await sb.rpc("add_group_members", { r: room.id, member_ids: adding });
      if (error) return (err.textContent = friendly(error));
      await loadRooms(); route();
    }});
    const picker = peoplePicker(ids, sel => { adding = sel; addBtn.disabled = !sel.length; addBtn.textContent = sel.length ? `Add ${sel.length}` : "Add"; });
    const addWrap = h("div",{hidden:true}, picker.el, h("div",{class:"gobar"}, addBtn));
    parts.push(h("div",{class:"gactions"},
      h("button",{class:"btn small", text:"+ Add people", onclick: () => { addWrap.hidden = !addWrap.hidden; if (!addWrap.hidden) picker.focus(); }}),
      h("button",{class:"btn small danger", text:"Leave group", onclick: async () => {
        if (!confirm(`Leave “${roomTitle(room)}”? You won't see its messages anymore unless someone adds you back.`)) return;
        const { error } = await sb.rpc("leave_group", { r: room.id });
        if (error) return (err.textContent = friendly(error));
        await loadRooms(); location.hash = "#/chat";
      }})), addWrap);
  } else if (mine){
    parts.push(h("button",{class:"btn small danger", text:"Leave group", onclick: async () => {
      if (!confirm(`Leave “${roomTitle(room)}”?`)) return;
      const { error } = await sb.rpc("leave_group", { r: room.id });
      if (error) return (err.textContent = friendly(error));
      await loadRooms(); location.hash = "#/chat";
    }}));
  }
  parts.push(err);
  box.append(...parts);
  return box;
}

async function renderLibrary(mineOnly){
  show(false, h("div",{class:"loading", text:"Loading essays…"}));
  let q = sb.from("works").select("id,title,kind,body,file_name,created_at,author_id,profiles(display_name)").order("created_at",{ascending:false});
  if (mineOnly) q = q.eq("author_id", me.id);
  const { data: works, error } = await q;
  if (error) throw error;

  const search = h("input",{type:"search", placeholder:"Search titles and authors…"});
  const kindSel = h("select",{}, h("option",{value:"", text:"All types"}), KINDS.map(k => h("option",{value:k, text:k})));
  const authors = [...new Map(works.map(w => [w.author_id, w.profiles?.display_name || "Unknown"])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));
  const authSel = h("select",{}, h("option",{value:"", text:"All students"}), authors.map(([id,n]) => h("option",{value:id, text:n})));
  const grid = h("div",{class:"grid"});

  function draw(){
    const s = search.value.trim().toLowerCase();

      (!kindSel.value || w.kind === kindSel.value) &&
      (!authSel.value || w.author_id === authSel.value) &&

    if (!list.length){
      grid.replaceChildren(h("div",{class:"empty card", style:"grid-column:1/-1"},
        h("h2",{text: works.length ? "Nothing matches that search" : (mineOnly ? "You haven't shared anything yet" : "No essays yet — for now")}),
        h("p",{class:"muted", text: works.length ? "Try a different word or clear the filters." : "Be the first to share an essay, poem or story."}),
        works.length ? null : h("a",{class:"btn primary", href:"#/new", text:"Share an essay"})));
      return;
    }
    grid.replaceChildren(...list.map(w => h("a",{class:"card work", href:`#/work/${w.id}`},
      h("span",{class:"tag", text:w.kind}),
      h("h3",{text:w.title}),
      h("div",{class:"by", text:`${w.profiles?.display_name || "Unknown"} · ${fmtDate(w.created_at)}`}),

  draw();
}

async function renderWork(id){
  show(false, h("div",{class:"loading", text:"Opening…"}));
  const { data: w, error } = await sb.from("works").select("*, profiles(display_name)").eq("id", id).maybeSingle();
  if (error) throw error;
  if (!w) return show(false, h("div",{class:"empty"}, h("h2",{text:"That piece isn't here anymore"}), h("a",{href:"#/essays", text:"Back to essays"})));
  S.works[w.id] = { id:w.id, title:w.title, kind:w.kind, author_id:w.author_id };

  const prose = h("div",{class:"prose"});
  (w.body || "").split(/\n\s*\n/).map(s => s.trim()).filter(Boolean).forEach(para => {
    const p = h("p");
    para.split("\n").forEach((line,i) => { if (i) p.append(h("br")); p.append(document.createTextNode(line)); });
    prose.append(p);
  });

  let attach = null;
  if (w.file_path){
    const { data: signed } = await sb.storage.from("works").createSignedUrl(w.file_path, 60*60);
    const url = signed?.signedUrl;
    const name = w.file_name || "file";
    if (url && /\.(png|jpe?g|gif|webp)$/i.test(name)) attach = h("div",{class:"attach card"}, h("img",{src:url, alt:w.title}));
    else if (url && /\.pdf$/i.test(name)) attach = h("div",{}, h("iframe",{class:"pdf", src:url, title:name}),
      h("p",{class:"hint"}, h("a",{href:url, target:"_blank", rel:"noopener", text:`Open ${name} in a new tab`})));
    else if (url) attach = h("div",{class:"attach card"}, h("span",{text:`📎 ${name}`}),
      h("a",{class:"btn", href:url, target:"_blank", rel:"noopener", text:"Open / download"}));
  }

  /* share to chat */
  const shareSlot = h("div");
  const shareBtn = h("button",{class:"btn primary", text:"💬 Share to chat", onclick: () => {
    if (shareSlot.firstChild){ shareSlot.replaceChildren(); return; }
    const targets = S.rooms.filter(r => inMySidebar(r) && canPost(r))
      .sort((a,b) => (a.kind === b.kind ? roomTitle(a).localeCompare(roomTitle(b)) : a.kind === "space" ? -1 : 1));
    const sel = h("select",{}, targets.map(r => h("option",{value:r.id, text:(r.kind === "space" ? "# " : r.kind === "group" ? "👥 " : "@ ") + roomTitle(r)})));
    const note = h("input",{type:"text", maxlength:"1000", placeholder:"Add a note (optional)"});
    const go = h("button",{class:"btn primary", text:"Send", onclick: async () => {
      go.disabled = true;
      const { error } = await sb.from("messages").insert({ room_id: sel.value, body: note.value.trim() || null, work_id: w.id });
      if (error){ go.disabled = false; return alert(friendly(error)); }
      location.hash = `#/chat/${sel.value}`;
    }});
    shareSlot.replaceChildren(h("div",{class:"share"}, sel, note, go));
    note.focus();
  }});

  const mine = w.author_id === me.id;
  const canDelete = mine || me.role === "teacher";
  const actions = h("div",{class:"actions"},
    shareBtn,
    mine ? h("a",{class:"btn", href:`#/edit/${w.id}`, text:"Edit"}) : null,
    canDelete ? h("button",{class:"btn danger", text:"Delete", onclick: async () => {
      if (!confirm(`Delete “${w.title}”? This can't be undone.`)) return;
      if (w.file_path) await sb.storage.from("works").remove([w.file_path]);
      const { error } = await sb.from("works").delete().eq("id", w.id);
      if (error) alert(friendly(error)); else { S.works[w.id] = null; location.hash = mine ? "#/mine" : "#/essays"; }
    }}) : null);

  show(false, h("article",{class:"reader"},
    h("a",{class:"back", href:"#/essays", text:"← All essays"}),
    h("span",{class:"tag", text:w.kind}),
    h("h1",{text:w.title}),
    h("div",{class:"meta"}, h("strong",{style:"color:var(--ink)", text:w.profiles?.display_name || "Unknown"}), h("span",{text:"·"}), h("span",{text:fmtDate(w.created_at)}),
      w.updated_at && (new Date(w.updated_at) - new Date(w.created_at) > 60000) ? h("span",{text:"· edited"}) : null),
    prose, attach, actions, shareSlot));
}

async function renderEditor(id){
  let w = null;
  if (id){
    const { data, error } = await sb.from("works").select("*").eq("id", id).maybeSingle();
    if (error) throw error;
    if (!data || data.author_id !== me.id) return show(false, h("div",{class:"msg err", text:"You can only edit your own work."}));
    w = data;
  }
  const msg = h("div",{class:"msg err"});
  const title = h("input",{type:"text", maxlength:"200", placeholder:"Give it a title", value: w?.title || ""});
  const kind = h("select",{}, KINDS.map(k => h("option",{value:k, text:k, selected: (w?.kind || "Essay") === k})));
  const body = h("textarea",{placeholder:"Type or paste your writing here…"}); body.value = w?.body || "";
  const file = h("input",{type:"file", accept:".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.gif,.webp", hidden:true});
  let removeFile = false;
  const fileLabel = h("div",{});
  const drawFile = () => {
    const chosen = file.files[0];
    if (chosen) fileLabel.replaceChildren(h("strong",{text:`📎 ${chosen.name}`}), " ", h("button",{class:"linkbtn", type:"button", text:"remove", onclick:(e)=>{ e.stopPropagation(); file.value=""; drawFile(); }}));
    else if (w?.file_path && !removeFile) fileLabel.replaceChildren(h("strong",{text:`📎 ${w.file_name}`}), " ", h("button",{class:"linkbtn", type:"button", text:"remove", onclick:(e)=>{ e.stopPropagation(); removeFile = true; drawFile(); }}));
    else fileLabel.replaceChildren(h("span",{text:"Drop a file here or "}), h("span",{class:"linkbtn", text:"choose one"}),
      h("div",{class:"hint", text:"PDF, Word, text, or a photo of handwritten work · up to 10 MB"}));
  };
  file.addEventListener("change", () => { removeFile = false; drawFile(); });
  const drop = h("div",{class:"drop", onclick:() => file.click(),
    ondragover:(e)=>{ e.preventDefault(); drop.classList.add("over"); },
    ondragleave:()=>drop.classList.remove("over"),
    ondrop:(e)=>{ e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files.length){ file.files = e.dataTransfer.files; removeFile = false; drawFile(); } }
  }, fileLabel, file);
  drawFile();
  const save = h("button",{class:"btn primary", type:"submit", text: w ? "Save changes" : "Share with the class"});

  const form = h("form",{onsubmit: async (ev) => {
    ev.preventDefault(); msg.textContent = "";
    const chosen = file.files[0];
    const keepsOldFile = w?.file_path && !removeFile && !chosen;
    if (!title.value.trim()) { msg.textContent = "Please add a title."; return; }
    if (!body.value.trim() && !chosen && !keepsOldFile) { msg.textContent = "Type your writing in the box or attach a file."; return; }
    if (chosen && chosen.size > 10*1024*1024) { msg.textContent = "That file is over 10 MB — try a smaller one or a PDF."; return; }
    save.disabled = true; save.textContent = "Saving…";
    try{
      const row = { title: title.value.trim(), kind: kind.value, body: body.value.trim() || null, updated_at: new Date().toISOString() };
      if (chosen){
        const safe = chosen.name.replace(/[^\w.\-]+/g,"_").slice(-80);
        const path = `${me.id}/${crypto.randomUUID()}-${safe}`;
        const { error: upErr } = await sb.storage.from("works").upload(path, chosen, { contentType: chosen.type || undefined });
        if (upErr) throw upErr;
        row.file_path = path; row.file_name = chosen.name;
      } else if (removeFile){
        row.file_path = null; row.file_name = null;
      }
      let savedId;
      if (w){
        const { error } = await sb.from("works").update(row).eq("id", w.id);
        if (error) throw error;
        if (w.file_path && (chosen || removeFile)) await sb.storage.from("works").remove([w.file_path]);
        savedId = w.id;
      } else {
        const { data, error } = await sb.from("works").insert(row).select("id").single();
        if (error) throw error;
        savedId = data.id;
      }
      delete S.works[savedId];
      location.hash = `#/work/${savedId}`;
    } catch(e){
      msg.textContent = friendly(e); save.disabled = false; save.textContent = w ? "Save changes" : "Share with the class";
    }
  }},
    h("div",{class:"row"},
      h("div",{}, h("label",{text:"Title"}), title),
      h("div",{}, h("label",{text:"Type"}), kind)),
    h("label",{text:"Your writing"}), body,
    h("div",{class:"hint", text:"Leave a blank line between paragraphs."}),
    h("label",{text:"Attach a file (optional)"}), drop,
    msg,
    h("div",{style:"display:flex;gap:10px;margin-top:22px"}, save,
      h("a",{class:"btn", href: w ? `#/work/${w.id}` : "#/essays", text:"Cancel"})));

  show(false, h("div",{class:"editor"},
    h("h1",{text: w ? "Edit your work" : "Share an essay"}),
    h("p",{class:"muted", text:"Everyone in the class will be able to read this. After posting, you can share it into any chat."}),
    h("div",{class:"card panel", style:"margin-top:18px"}, form)));
  title.focus();
}

async function renderManager(){
  const [{ data: people, error }] = await Promise.all([
    sb.from("profiles").select("*").order("created_at",{ascending:true}),
    loadRooms()
  ]);
  if (error) throw error;
  people.forEach(p => { S.people[p.id] = p; });
  const pending = people.filter(p => !p.approved);
  const members = people.filter(p => p.approved);

  const setApproved = async (p, val) => {
    if (!val && !confirm(`Remove ${p.display_name}'s access? Their posts stay, but they won't be able to chat, read or post.`)) return;
    const { error } = await sb.rpc("set_approved", { target: p.id, value: val });
    if (error) alert(friendly(error)); else renderManager();
  };
  const tbl = (rows, cols) => h("table",{}, h("thead",{}, h("tr",{}, cols.map(c => h("th",{text:c})))), h("tbody",{}, rows));

  const dmToggle = h("input",{type:"checkbox", checked: S.dmsEnabled});
  dmToggle.addEventListener("change", async () => {
    const { error } = await sb.rpc("set_dms_enabled", { value: dmToggle.checked });
    if (error){ alert(friendly(error)); dmToggle.checked = !dmToggle.checked; return; }
    S.dmsEnabled = dmToggle.checked;
  });

  const allDms = S.rooms.filter(r => r.kind !== "space").sort((a,b) => ts(b.last_message_at) - ts(a.last_message_at));

  show(false,
    h("h1",{text:"Manager"}),
    h("p",{class:"muted", text:"Approve new accounts so only your class can get in. You can delete any message, essay or space."}),
    h("div",{class:"card panel section"},
      h("h2",{text:`Waiting for approval (${pending.length})`}),
      pending.length ? tbl(pending.map(p => h("tr",{},
        h("td",{}, h("strong",{text:p.display_name})),
        h("td",{class:"muted", text:`Signed up ${fmtDate(p.created_at)}`}),
        h("td",{style:"text-align:right"}, h("button",{class:"btn primary small", text:"Approve", onclick:() => setApproved(p,true)}))
      )), ["Name","",""]) : h("p",{class:"muted", text:"No one is waiting."})),
    h("div",{class:"card panel section"},
      h("h2",{text:"Chat settings"}),
      h("label",{class:"toggle"}, dmToggle, "Allow private chats (direct messages and group chats)"),
      h("p",{class:"hint", text:"When off, students can still read old private chats but can't send new messages or start new ones. Spaces are unaffected."})),
    h("div",{class:"card panel section"},
      h("h2",{text:`Private chats (${allDms.length})`}),
      allDms.length ? tbl(allDms.map(r => h("tr",{},
        h("td",{}, h("strong",{text: r.kind === "group" ? `👥 ${r.name ? r.name + ": " : ""}${memberIds(r).map(personName).sort().join(", ")}` : memberIds(r).map(personName).join(" & ")})),
        h("td",{class:"muted", text: r.last_message_at ? `Last message ${fmtDate(r.last_message_at)}` : "No messages yet"}),
        h("td",{style:"text-align:right"}, h("a",{class:"btn small", href:`#/chat/${r.id}`, text:"Read"}))
      )), ["Who","",""]) : h("p",{class:"muted", text:"No private chats yet."})),
    h("div",{class:"card panel section"},
      h("h2",{text:`Class members (${members.length})`}),
      tbl(members.map(p => h("tr",{},
        h("td",{}, h("strong",{text:p.display_name})),
        h("td",{}, h("span",{class:"pill", text: p.role === "teacher" ? "Manager" : "Student"})),
        h("td",{style:"text-align:right"}, p.id === me.id ? h("span",{class:"muted", text:"You"}) :
          h("button",{class:"btn small danger", text:"Remove access", onclick:() => setApproved(p,false)}))
      )), ["Name","Role",""]))
  );
}

/* ---------- account ---------- */
function renderAccount(){
  const msg = h("div",{class:"msg err"}), ok = h("div",{class:"msg ok"});
  const name = h("input",{type:"text", maxlength:"60", value: me.display_name});
  show(false, h("div",{class:"editor"}, h("h1",{text:"Your account"}),
    h("div",{class:"card panel"},
      h("p",{class:"muted", style:"margin-top:0", text:`Signed in as ${session.user.email}`}),
      h("form",{onsubmit: async (ev) => {
        ev.preventDefault(); msg.textContent = ""; ok.textContent = "";
        const v = name.value.trim(); if (!v){ msg.textContent = "Name can't be empty."; return; }
        const { error } = await sb.from("profiles").update({ display_name: v }).eq("id", me.id);
        if (error){ msg.textContent = friendly(error); return; }
        me.display_name = v; if (S.people[me.id]) S.people[me.id].display_name = v;
        renderHeader(); ok.textContent = "Saved.";
      }}, h("label",{text:"Name shown to the class"}), name, msg, ok,
         h("button",{class:"btn primary", type:"submit", style:"margin-top:16px", text:"Save"})))));
}

boot();
})();
</script>
</body>
</html>
